<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kōroku — Anime Lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>

  /* ============ TOKENS ============ */
  :root{
    --font-display: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;

    /* seed: violet-periwinkle primary, coral accent */
    --md-primary: #5C4FDB;
    --md-primary-hover: #4C3FC7;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #E4DFFF;
    --md-on-primary-container: #1A0D5C;

    --md-secondary: #FF7A59;
    --md-on-secondary: #3A1200;

    --md-error: #B3261E;
    --md-on-error: #FFFFFF;
    --md-error-container: #F9DEDC;

    --md-surface: #FBF8FF;
    --md-surface-dim: #DDD9E6;
    --md-surface-container-low: #F5F2FB;
    --md-surface-container: #EFEBF7;
    --md-surface-container-high: #E9E4F3;
    --md-on-surface: #1B1B23;
    --md-on-surface-variant: #46464F;
    --md-outline: #C8C5D3;
    --md-outline-variant: #DDDAE8;

    --shadow-1: 0 1px 2px rgba(20,15,55,0.12), 0 1px 3px 1px rgba(20,15,55,0.08);
    --shadow-2: 0 1px 2px rgba(20,15,55,0.14), 0 2px 6px 2px rgba(20,15,55,0.10);
    --shadow-3: 0 4px 8px rgba(20,15,55,0.16), 0 1px 3px rgba(20,15,55,0.12);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --md-primary: #C6BEFF;
      --md-primary-hover: #D8D2FF;
      --md-on-primary: #2A1B8F;
      --md-primary-container: #4030B0;
      --md-on-primary-container: #E4DFFF;

      --md-secondary: #FFB59C;
      --md-on-secondary: #5A2109;

      --md-error: #F2B8B5;
      --md-on-error: #601410;
      --md-error-container: #8C1D18;

      --md-surface: #131218;
      --md-surface-dim: #131218;
      --md-surface-container-low: #1B1A22;
      --md-surface-container: #1F1E27;
      --md-surface-container-high: #292832;
      --md-on-surface: #E7E1F0;
      --md-on-surface-variant: #C9C4D6;
      --md-outline: #4B4857;
      --md-outline-variant: #322F3C;

      --shadow-1: 0 1px 2px rgba(0,0,0,0.35), 0 1px 3px 1px rgba(0,0,0,0.25);
      --shadow-2: 0 1px 2px rgba(0,0,0,0.4), 0 2px 6px 2px rgba(0,0,0,0.3);
      --shadow-3: 0 4px 8px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --md-primary: #C6BEFF;
    --md-primary-hover: #D8D2FF;
    --md-on-primary: #2A1B8F;
    --md-primary-container: #4030B0;
    --md-on-primary-container: #E4DFFF;

    --md-secondary: #FFB59C;
    --md-on-secondary: #5A2109;

    --md-error: #F2B8B5;
    --md-on-error: #601410;
    --md-error-container: #8C1D18;

    --md-surface: #131218;
    --md-surface-dim: #131218;
    --md-surface-container-low: #1B1A22;
    --md-surface-container: #1F1E27;
    --md-surface-container-high: #292832;
    --md-on-surface: #E7E1F0;
    --md-on-surface-variant: #C9C4D6;
    --md-outline: #4B4857;
    --md-outline-variant: #322F3C;

    --shadow-1: 0 1px 2px rgba(0,0,0,0.35), 0 1px 3px 1px rgba(0,0,0,0.25);
    --shadow-2: 0 1px 2px rgba(0,0,0,0.4), 0 2px 6px 2px rgba(0,0,0,0.3);
    --shadow-3: 0 4px 8px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.3);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--md-surface);
    color:var(--md-on-surface);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--md-primary-container); color:var(--md-on-primary-container); }
  button{ font-family:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--md-outline); border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ============ APP SHELL ============ */
  .app{ display:flex; height:100vh; overflow:hidden; }

  /* --- Nav rail --- */
  .rail{
    width:248px; flex:none; background:var(--md-surface-container-low);
    border-right:1px solid var(--md-outline-variant);
    display:flex; flex-direction:column; padding:20px 12px;
    overflow-y:auto;
  }
  .brand{
    display:flex; align-items:center; gap:10px; padding:6px 10px 20px 10px;
  }
  .brand-mark{
    width:36px; height:36px; border-radius:11px; flex:none;
    background:linear-gradient(135deg, var(--md-primary), var(--md-secondary));
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .brand-name{ font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:-0.02em; }
  .rail-section-label{
    font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--md-on-surface-variant);
    padding:14px 14px 6px; text-transform:uppercase;
  }
  .rail-item{
    display:flex; align-items:center; gap:12px; padding:10px 14px;
    border-radius:20px; cursor:pointer; color:var(--md-on-surface-variant);
    font-weight:600; font-size:14px; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
    transition:background .15s ease, color .15s ease;
  }
  .rail-item:hover{ background:var(--md-surface-container-high); }
  .rail-item.active{ background:var(--md-primary-container); color:var(--md-on-primary-container); }
  .rail-item .count{ margin-left:auto; font-size:12px; font-weight:700; opacity:.65; }
  .rail-item .rail-icon{ width:20px; text-align:center; flex:none; }
  .rail-new{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-top:6px;
    border-radius:20px; cursor:pointer; border:1px dashed var(--md-outline); background:none;
    color:var(--md-on-surface-variant); font-weight:600; font-size:13.5px; width:100%;
  }
  .rail-new:hover{ border-color:var(--md-primary); color:var(--md-primary); }
  .rail-spacer{ flex:1; }
  .theme-toggle{
    display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:20px;
    border:none; background:var(--md-surface-container-high); color:var(--md-on-surface);
    font-weight:600; font-size:13px; cursor:pointer; width:100%; justify-content:center;
  }

  /* --- Main column --- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }

  .topbar{
    display:flex; align-items:center; gap:16px; padding:16px 28px;
    border-bottom:1px solid var(--md-outline-variant); flex:none; position:relative; z-index:20;
    background:var(--md-surface);
  }
  .search-box{
    flex:1; max-width:640px; position:relative; display:flex; align-items:center;
    background:var(--md-surface-container-high); border-radius:28px; padding:0 16px; height:48px;
    border:1px solid transparent;
  }
  .search-box:focus-within{ border-color:var(--md-primary); }
  .search-box svg{ flex:none; color:var(--md-on-surface-variant); }
  .search-box input{
    border:none; outline:none; background:none; flex:1; padding:0 10px;
    font-size:15px; color:var(--md-on-surface); font-family:var(--font-body);
  }
  .search-box input::placeholder{ color:var(--md-on-surface-variant); }
  .search-clear{ border:none; background:none; cursor:pointer; color:var(--md-on-surface-variant); display:none; padding:4px; border-radius:50%; }
  .search-clear:hover{ background:var(--md-surface-container); }

  .list-title-block{ display:flex; flex-direction:column; }
  .list-title{ font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:-0.01em; }
  .list-sub{ font-size:12.5px; color:var(--md-on-surface-variant); margin-top:1px; }

  .topbar-actions{ display:flex; gap:8px; margin-left:auto; }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:none; background:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--md-on-surface-variant);
  }
  .icon-btn:hover{ background:var(--md-surface-container-high); color:var(--md-on-surface); }

  /* --- Search results dropdown --- */
  .search-results{
    position:absolute; top:74px; left:28px; right:28px; max-width:640px;
    background:var(--md-surface-container-low); border-radius:20px; box-shadow:var(--shadow-3);
    border:1px solid var(--md-outline-variant); max-height:min(560px, 70vh); overflow-y:auto;
    z-index:30; display:none;
  }
  .search-results.open{ display:block; }
  .sr-state{ padding:28px 20px; text-align:center; color:var(--md-on-surface-variant); font-size:13.5px; }
  .sr-row{
    display:flex; gap:12px; padding:10px 14px; align-items:center; border-bottom:1px solid var(--md-outline-variant);
  }
  .sr-row:last-child{ border-bottom:none; }
  .sr-cover{ width:44px; height:62px; border-radius:8px; object-fit:cover; flex:none; background:var(--md-surface-container-high); }
  .sr-info{ min-width:0; flex:1; }
  .sr-title{ font-weight:700; font-size:13.5px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .sr-meta{ font-size:11.5px; color:var(--md-on-surface-variant); margin-top:3px; }
  .sr-add{ display:flex; gap:6px; flex:none; align-items:center; }
  .sr-select{
    font-size:12px; border-radius:10px; border:1px solid var(--md-outline); background:var(--md-surface);
    color:var(--md-on-surface); padding:6px 8px; max-width:150px;
  }
  .sr-add-btn{
    border:none; background:var(--md-primary); color:var(--md-on-primary); border-radius:10px;
    padding:7px 12px; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .sr-add-btn:hover{ background:var(--md-primary-hover); }
  .sr-add-btn:disabled{ opacity:.5; cursor:default; }
  .sr-manual{
    padding:12px 16px; text-align:center; font-size:12.5px; color:var(--md-on-surface-variant);
  }
  .sr-manual a{ color:var(--md-primary); font-weight:700; cursor:pointer; text-decoration:none; }

  /* --- Content area --- */
  .content{ flex:1; overflow-y:auto; padding:22px 28px 100px; }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:70px 20px; color:var(--md-on-surface-variant); gap:10px;
  }
  .empty-state h3{ font-family:var(--font-display); color:var(--md-on-surface); margin:0; font-size:18px; }
  .empty-state p{ margin:0; max-width:340px; font-size:13.5px; }

  .category{ margin-bottom:8px; }
  .category-header{
    display:flex; align-items:center; gap:10px; padding:14px 4px 10px;
  }
  .category-name{ font-family:var(--font-display); font-weight:700; font-size:16px; }
  .category-count{
    background:var(--md-surface-container-high); color:var(--md-on-surface-variant);
    font-size:11.5px; font-weight:700; border-radius:10px; padding:2px 9px;
  }
  .category-menu-btn{ margin-left:auto; }
  .cat-drop-empty{
    border:1.5px dashed var(--md-outline-variant); border-radius:16px; padding:18px;
    text-align:center; color:var(--md-on-surface-variant); font-size:12.5px; margin:0 4px 6px;
  }

  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:14px;
    min-height:8px; padding:2px 4px 10px;
  }
  .anime-card{
    background:var(--md-surface-container-low); border-radius:16px; overflow:hidden;
    box-shadow:var(--shadow-1); display:flex; flex-direction:column; cursor:grab;
    border:1px solid var(--md-outline-variant); position:relative;
  }
  .anime-card.sortable-ghost{ opacity:.35; }
  .anime-card.sortable-drag{ cursor:grabbing; box-shadow:var(--shadow-3); }
  .card-cover-wrap{ position:relative; width:100%; aspect-ratio:2/3; background:var(--md-surface-container-high); overflow:hidden; }
  .card-cover-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-menu-btn{
    position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:50%;
    border:none; background:rgba(20,15,40,0.55); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; backdrop-filter:blur(2px);
  }
  .card-menu-btn:hover{ background:rgba(20,15,40,0.8); }
  .card-format-chip{
    position:absolute; bottom:6px; left:6px; background:rgba(20,15,40,0.6); color:#fff;
    font-size:10px; font-weight:700; padding:3px 8px; border-radius:8px; letter-spacing:.02em;
  }
  .card-body{ padding:10px 11px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card-title{ font-weight:700; font-size:13px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-meta{ font-size:11px; color:var(--md-on-surface-variant); }
  .card-progress{ display:flex; align-items:center; gap:6px; margin-top:auto; }
  .prog-btn{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--md-outline); background:var(--md-surface);
    color:var(--md-on-surface); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; flex:none;
  }
  .prog-btn:hover{ background:var(--md-surface-container-high); }
  .prog-text{ font-size:11px; font-weight:700; color:var(--md-on-surface-variant); flex:1; text-align:center; }

  /* --- FAB --- */
  .fab{
    position:absolute; bottom:26px; right:30px; width:56px; height:56px; border-radius:16px;
    background:var(--md-secondary); color:var(--md-on-secondary); border:none; box-shadow:var(--shadow-3);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:26px; z-index:15;
  }
  .fab:hover{ transform:translateY(-1px); }

  /* --- Modal / dialog --- */
  .scrim{
    position:fixed; inset:0; background:rgba(10,8,25,0.45); z-index:100; display:none;
    align-items:center; justify-content:center; padding:20px;
  }
  .scrim.open{ display:flex; }
  .dialog{
    background:var(--md-surface-container-low); border-radius:24px; width:100%; max-width:440px;
    box-shadow:var(--shadow-3); padding:22px 22px 18px; max-height:85vh; overflow-y:auto;
  }
  .dialog h2{ font-family:var(--font-display); font-size:19px; margin:0 0 4px; }
  .dialog p.hint{ font-size:12.5px; color:var(--md-on-surface-variant); margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--md-on-surface-variant); margin-bottom:6px; }
  .field input, .field textarea, .field select{
    width:100%; border:1px solid var(--md-outline); background:var(--md-surface); color:var(--md-on-surface);
    border-radius:12px; padding:10px 12px; font-size:14px; font-family:inherit; outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--md-primary); }
  .field textarea{ resize:vertical; min-height:64px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:8px 14px; border-radius:18px; border:1px solid var(--md-outline); background:var(--md-surface);
    font-size:12.5px; font-weight:600; cursor:pointer; color:var(--md-on-surface);
  }
  .chip.selected{ background:var(--md-primary-container); color:var(--md-on-primary-container); border-color:transparent; }
  .dialog-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .btn{
    border:none; border-radius:20px; padding:10px 18px; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .btn-text{ background:none; color:var(--md-primary); }
  .btn-text:hover{ background:var(--md-primary-container); }
  .btn-filled{ background:var(--md-primary); color:var(--md-on-primary); }
  .btn-filled:hover{ background:var(--md-primary-hover); }
  .btn-danger{ background:var(--md-error-container); color:var(--md-error); }
  .btn-danger:hover{ filter:brightness(0.97); }

  .menu-popover{
    position:fixed; background:var(--md-surface-container-low); border-radius:14px; box-shadow:var(--shadow-3);
    border:1px solid var(--md-outline-variant); padding:6px; z-index:110; min-width:190px; display:none;
  }
  .menu-popover.open{ display:block; }
  .menu-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none;
    padding:9px 12px; border-radius:10px; font-size:13px; font-weight:600; color:var(--md-on-surface); cursor:pointer;
  }
  .menu-item:hover{ background:var(--md-surface-container-high); }
  .menu-item.danger{ color:var(--md-error); }
  .menu-sep{ height:1px; background:var(--md-outline-variant); margin:5px 4px; }

  /* --- Snackbar --- */
  .snackbar{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--md-on-surface); color:var(--md-surface); padding:12px 16px; border-radius:12px;
    box-shadow:var(--shadow-3); font-size:13.5px; display:flex; align-items:center; gap:16px; z-index:200;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; max-width:90vw;
  }
  .snackbar.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .snackbar button{ background:none; border:none; color:var(--md-primary); font-weight:700; cursor:pointer; font-size:13px; flex:none; }

  @media (max-width: 760px){
    .rail{ width:76px; padding:16px 6px; }
    .brand-name, .rail-section-label, .rail-item span:not(.rail-icon), .rail-new span, .theme-toggle span{ display:none; }
    .rail-item, .rail-new, .theme-toggle{ justify-content:center; padding:12px; }
    .rail-item .count{ display:none; }
    .content{ padding:16px; }
    .topbar{ padding:12px 16px; flex-wrap:wrap; }
    .list-title-block{ order:3; width:100%; }
    .search-results{ left:16px; right:16px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- NAV RAIL -->
  <nav class="rail" id="rail">
    <div class="brand">
      <div class="brand-mark">K</div>
      <div class="brand-name">Kōroku</div>
    </div>

    <div class="rail-section-label">Your lists</div>
    <div id="railLists"></div>
    <button class="rail-new" id="newListBtn"><span class="rail-icon">+</span><span>New list</span></button>

    <div class="rail-spacer"></div>
    <button class="theme-toggle" id="themeToggle"><span id="themeLabel">Theme: System</span></button>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="list-title-block">
        <div class="list-title" id="currentListName">—</div>
        <div class="list-sub" id="currentListSub">0 titles</div>
      </div>
      <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm10 2-5.5-5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Search AniList for a show to add…" autocomplete="off">
        <button class="search-clear" id="searchClear">✕</button>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="manageCatsBtn" title="Manage categories">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="listMenuBtn" title="List options">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V19.4a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H4.6a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 6.2 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H10.6a1.65 1.65 0 0 0 1-1.51V2.6a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V8.6a1.65 1.65 0 0 0 1.51 1h.09a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="content" id="content"></div>

    <button class="fab" id="fabAdd" title="Add category">+</button>
  </div>
</div>

<div class="scrim" id="scrim"><div class="dialog" id="dialogInner"></div></div>
<div class="menu-popover" id="popover"></div>
<div class="snackbar" id="snackbar"><span id="snackbarText"></span><button id="snackbarAction"></button></div>

<script>
(function(){
"use strict";

/* ================= DATA LAYER ================= */
const STORAGE_KEY = "koroku_anime_tracker_v1";
const DEFAULT_CATS = ["Watching","Plan to Watch","Completed","On Hold","Dropped"];

function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function seedData(){
  return {
    theme: "system",
    activeListId: null,
    settings: {
      anilistClientId: "",
      anilistToken: "",
      anilistTokenExpiry: 0,
      anilistUsername: "",
      anilistUserId: null,
      omdbApiKey: ""
    },
    lists: [
      {
        id: uid("list"),
        name: "My Anime",
        categories: DEFAULT_CATS.map(name => ({ id: uid("cat"), name, entries: [] }))
      }
    ]
  };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) throw new Error("empty");
    const parsed = JSON.parse(raw);
    if(!parsed.lists || !parsed.lists.length) throw new Error("bad shape");
    return parsed;
  }catch(e){
    const fresh = seedData();
    return fresh;
  }
}

let state = loadData();
if(!state.activeListId || !state.lists.find(l=>l.id===state.activeListId)){
  state.activeListId = state.lists[0].id;
}
if(!state.settings){
  state.settings = {
    anilistClientId: "",
    anilistToken: "",
    anilistTokenExpiry: 0,
    anilistUsername: "",
    anilistUserId: null,
    omdbApiKey: ""
  };
}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error("Could not save", e); }
}

function activeList(){ return state.lists.find(l => l.id === state.activeListId); }
function findCategory(list, catId){ return list.categories.find(c => c.id === catId); }
function totalEntries(list){ return list.categories.reduce((n,c)=>n+c.entries.length,0); }

/* ================= UTIL ================= */
function stripHtml(str){
  if(!str) return "";
  return str
    .replace(/<br\s*\/?>/gi, " ")
    .replace(/<[^>]+>/g, "")
    .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/&nbsp;/g," ")
    .trim();
}
function escapeHtml(str){
  if(str===undefined || str===null) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatLabel(fmt){
  const map = { TV:"TV", TV_SHORT:"TV Short", MOVIE:"Movie", SPECIAL:"Special", OVA:"OVA", ONA:"ONA", MUSIC:"Music" };
  return map[fmt] || fmt || "";
}
function seasonLabel(season, year){
  const s = season ? season.charAt(0) + season.slice(1).toLowerCase() : "";
  return [s, year].filter(Boolean).join(" ");
}
function debounce(fn, ms){
  let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), ms); };
}

/* ================= SNACKBAR ================= */
let snackTimer;
function showSnackbar(text, actionLabel, actionFn){
  const bar = document.getElementById("snackbar");
  document.getElementById("snackbarText").textContent = text;
  const actionBtn = document.getElementById("snackbarAction");
  if(actionLabel){
    actionBtn.textContent = actionLabel;
    actionBtn.style.display = "";
    actionBtn.onclick = () => { actionFn && actionFn(); bar.classList.remove("show"); };
  } else {
    actionBtn.style.display = "none";
  }
  bar.classList.add("show");
  clearTimeout(snackTimer);
  snackTimer = setTimeout(()=> bar.classList.remove("show"), 4000);
}

/* ================= DIALOG HELPERS ================= */
function openDialog(html, onOpen){
  document.getElementById("dialogInner").innerHTML = html;
  document.getElementById("scrim").classList.add("open");
  if(onOpen) onOpen(document.getElementById("dialogInner"));
}
function closeDialog(){ document.getElementById("scrim").classList.remove("open"); }
document.getElementById("scrim").addEventListener("click", e => { if(e.target.id === "scrim") closeDialog(); });

function promptDialog({title, hint, label, placeholder, value="", confirmLabel="Save", onConfirm}){
  openDialog(`
    <h2>${escapeHtml(title)}</h2>
    ${hint ? `<p class="hint">${escapeHtml(hint)}</p>` : ""}
    <div class="field"><label>${escapeHtml(label)}</label><input type="text" id="pdInput" placeholder="${escapeHtml(placeholder||"")}" value="${escapeHtml(value)}"></div>
    <div class="dialog-actions">
      <button class="btn btn-text" id="pdCancel">Cancel</button>
      <button class="btn btn-filled" id="pdConfirm">${escapeHtml(confirmLabel)}</button>
    </div>
  `, root => {
    const input = root.querySelector("#pdInput");
    input.focus(); input.select();
    root.querySelector("#pdCancel").onclick = closeDialog;
    const submit = () => {
      const v = input.value.trim();
      if(!v) { input.focus(); return; }
      onConfirm(v);
      closeDialog();
    };
    root.querySelector("#pdConfirm").onclick = submit;
    input.addEventListener("keydown", e => { if(e.key==="Enter") submit(); });
  });
}

function confirmDialog({title, hint, confirmLabel="Delete", danger=true, onConfirm}){
  openDialog(`
    <h2>${escapeHtml(title)}</h2>
    <p class="hint">${escapeHtml(hint||"")}</p>
    <div class="dialog-actions">
      <button class="btn btn-text" id="cdCancel">Cancel</button>
      <button class="btn ${danger?'btn-danger':'btn-filled'}" id="cdConfirm">${escapeHtml(confirmLabel)}</button>
    </div>
  `, root => {
    root.querySelector("#cdCancel").onclick = closeDialog;
    root.querySelector("#cdConfirm").onclick = () => { onConfirm(); closeDialog(); };
  });
}

/* popover menu */
function openPopover(x, y, items){
  const pop = document.getElementById("popover");
  pop.innerHTML = items.map((it,i) => it.sep
    ? `<div class="menu-sep"></div>`
    : `<button class="menu-item ${it.danger?'danger':''}" data-i="${i}">${it.icon||""} ${escapeHtml(it.label)}</button>`
  ).join("");
  pop.style.left = "0px"; pop.style.top = "0px";
  pop.classList.add("open");
  const rect = pop.getBoundingClientRect();
  let left = x, top = y;
  if(left + rect.width > window.innerWidth - 10) left = window.innerWidth - rect.width - 10;
  if(top + rect.height > window.innerHeight - 10) top = window.innerHeight - rect.height - 10;
  pop.style.left = left + "px"; pop.style.top = top + "px";
  pop.querySelectorAll(".menu-item").forEach(btn => {
    btn.onclick = () => { closePopover(); items[+btn.dataset.i].onClick(); };
  });
}
function closePopover(){ document.getElementById("popover").classList.remove("open"); }
document.addEventListener("click", e => {
  const pop = document.getElementById("popover");
  if(pop.classList.contains("open") && !pop.contains(e.target) && !e.target.closest(".card-menu-btn, .category-menu-btn, #listMenuBtn")){
    closePopover();
  }
});
window.addEventListener("scroll", closePopover, true);

/* ================= RENDER: RAIL ================= */
function renderRail(){
  const wrap = document.getElementById("railLists");
  wrap.innerHTML = state.lists.map(list => `
    <button class="rail-item ${list.id===state.activeListId?'active':''}" data-list="${list.id}">
      <span>${escapeHtml(list.name)}</span>
      <span class="count">${totalEntries(list)}</span>
    </button>
  `).join("");
  wrap.querySelectorAll(".rail-item").forEach(btn => {
    btn.onclick = () => { state.activeListId = btn.dataset.list; save(); renderAll(); };
  });
}

/* ================= RENDER: CONTENT ================= */
function renderTopbar(){
  const list = activeList();
  document.getElementById("currentListName").textContent = list.name;
  const n = totalEntries(list);
  document.getElementById("currentListSub").textContent = `${n} title${n===1?"":"s"} · ${list.categories.length} categories`;
}

function cardHtml(entry, cat){
  const cover = entry.cover ? `<img src="${escapeHtml(entry.cover)}" alt="" loading="lazy">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:var(--md-on-surface-variant);text-align:center;padding:8px;">No cover</div>`;
  const metaBits = [];
  if(entry.season || entry.seasonYear) metaBits.push(seasonLabel(entry.season, entry.seasonYear));
  if(entry.episodes) metaBits.push(entry.episodes + " ep");
  if(entry.imdbRating) metaBits.push("IMDb " + entry.imdbRating);
  const showProgress = entry.episodes || entry.progress > 0 || cat.name.toLowerCase().includes("watch");
  return `
    <div class="anime-card" data-entry="${entry.id}">
      <div class="card-cover-wrap">
        ${cover}
        ${entry.format ? `<div class="card-format-chip">${escapeHtml(formatLabel(entry.format))}</div>` : ""}
        <button class="card-menu-btn" data-menu="${entry.id}" title="Options">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="card-body">
        <div class="card-title" title="${escapeHtml(entry.title)}">${escapeHtml(entry.title)}</div>
        ${metaBits.length ? `<div class="card-meta">${escapeHtml(metaBits.join(" · "))}</div>` : ""}
        ${showProgress ? `
          <div class="card-progress">
            <button class="prog-btn" data-dec="${entry.id}">−</button>
            <span class="prog-text">${entry.progress||0}${entry.episodes ? " / " + entry.episodes : ""}</span>
            <button class="prog-btn" data-inc="${entry.id}">+</button>
          </div>` : ""}
      </div>
    </div>
  `;
}

function renderContent(){
  const list = activeList();
  const content = document.getElementById("content");

  if(totalEntries(list) === 0 && list.categories.every(c=>c.entries.length===0)){
    content.innerHTML = list.categories.map(cat => categoryBlockHtml(cat, true)).join("") ||
      `<div class="empty-state"><h3>Nothing here yet</h3><p>Search AniList above to find a show, then add it to a category in this list.</p></div>`;
  } else {
    content.innerHTML = list.categories.map(cat => categoryBlockHtml(cat, false)).join("");
  }

  // sortable per category
  content.querySelectorAll(".card-grid").forEach(grid => {
    Sortable.create(grid, {
      group: "anime-shared",
      animation: 160,
      ghostClass: "sortable-ghost",
      dragClass: "sortable-drag",
      onEnd: syncOrderFromDom
    });
  });

  // wire up card interactions
  content.querySelectorAll("[data-menu]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const entryId = btn.dataset.menu;
      const rect = btn.getBoundingClientRect();
      openCardMenu(entryId, rect.left, rect.bottom + 4);
    });
  });
  content.querySelectorAll("[data-inc]").forEach(btn => btn.addEventListener("click", () => bumpProgress(btn.dataset.inc, 1)));
  content.querySelectorAll("[data-dec]").forEach(btn => btn.addEventListener("click", () => bumpProgress(btn.dataset.dec, -1)));
  content.querySelectorAll(".category-menu-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const rect = btn.getBoundingClientRect();
      openCategoryMenu(btn.dataset.cat, rect.left, rect.bottom + 4);
    });
  });
}

function categoryBlockHtml(cat, forceEmpty){
  const cards = cat.entries.map(entry => cardHtml(entry, cat)).join("");
  return `
    <div class="category" data-cat="${cat.id}">
      <div class="category-header">
        <div class="category-name">${escapeHtml(cat.name)}</div>
        <div class="category-count">${cat.entries.length}</div>
        <button class="icon-btn category-menu-btn" data-cat="${cat.id}" title="Category options">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="card-grid" data-cat="${cat.id}">${cards}</div>
      ${cat.entries.length===0 ? `<div class="cat-drop-empty">Drag a title here, or add one from search</div>` : ""}
    </div>
  `;
}

function bumpProgress(entryId, delta){
  const list = activeList();
  for(const cat of list.categories){
    const e = cat.entries.find(x=>x.id===entryId);
    if(e){
      e.progress = Math.max(0, (e.progress||0) + delta);
      if(e.episodes) e.progress = Math.min(e.progress, e.episodes);
      save(); renderContent();
      return;
    }
  }
}

function syncOrderFromDom(){
  const list = activeList();
  document.querySelectorAll(".card-grid").forEach(grid => {
    const catId = grid.dataset.cat;
    const cat = findCategory(list, catId);
    if(!cat) return;
    const idsInOrder = [...grid.querySelectorAll(".anime-card")].map(c => c.dataset.entry);
    // gather entries by id across all categories of this list (since drag may move across categories)
    const newEntries = idsInOrder.map(id => findEntryAnywhere(list, id)).filter(Boolean);
    cat.entries = newEntries;
  });
  // remove duplicates: an entry now living in its new category should be removed from any old one
  const seen = new Set();
  list_dedupe(activeList(), seen);
  save();
  renderRail();
  renderTopbar();
  // re-render to fix empty-state placeholders / counts without breaking drag mid-gesture
  renderContent();
}
function list_dedupe(list, seen){
  for(const cat of list.categories){
    cat.entries = cat.entries.filter(e => {
      if(seen.has(e.id)) return false;
      seen.add(e.id);
      return true;
    });
  }
}
function findEntryAnywhere(list, id){
  for(const cat of list.categories){
    const e = cat.entries.find(x=>x.id===id);
    if(e) return e;
  }
  return null;
}

/* ================= CARD / CATEGORY MENUS ================= */
function openCardMenu(entryId, x, y){
  const list = activeList();
  let ownerCat = null, entry = null;
  for(const cat of list.categories){
    const found = cat.entries.find(e=>e.id===entryId);
    if(found){ ownerCat = cat; entry = found; break; }
  }
  if(!entry) return;
  const items = [
    { label:"Move to…", onClick: () => openMoveDialog(entry, ownerCat) },
  ];
  if(entry.aniListId){
    items.push({ label:"Open on AniList", onClick: () => window.open(`https://anilist.co/anime/${entry.aniListId}`, "_blank") });
  }
  if(entry.imdbId){
    items.push({ label:"Open on IMDb", onClick: () => window.open(`https://www.imdb.com/title/${entry.imdbId}/`, "_blank") });
  } else {
    items.push({ label:"Look up IMDb rating", onClick: () => lookupImdb(entry) });
  }
  items.push({ sep:true });
  items.push({ label:"Remove from list", danger:true, onClick: () => removeEntry(entry, ownerCat) });
  openPopover(x, y, items);
}

function removeEntry(entry, cat){
  const idx = cat.entries.indexOf(entry);
  cat.entries.splice(idx, 1);
  save(); renderAll();
  showSnackbar(`Removed "${entry.title}"`, "Undo", () => {
    cat.entries.splice(idx, 0, entry);
    save(); renderAll();
  });
}

function openMoveDialog(entry, currentCat){
  const list = activeList();
  openDialog(`
    <h2>Move "${escapeHtml(entry.title)}"</h2>
    <p class="hint">Choose a category in ${escapeHtml(list.name)}</p>
    <div class="chip-row" id="moveChips">
      ${list.categories.map(c => `<button class="chip ${c.id===currentCat.id?'selected':''}" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join("")}
    </div>
    <div class="dialog-actions"><button class="btn btn-text" id="mdCancel">Cancel</button></div>
  `, root => {
    root.querySelector("#mdCancel").onclick = closeDialog;
    root.querySelectorAll("#moveChips .chip").forEach(chip => {
      chip.onclick = () => {
        const targetCat = findCategory(list, chip.dataset.cat);
        if(targetCat.id !== currentCat.id){
          currentCat.entries = currentCat.entries.filter(e=>e!==entry);
          targetCat.entries.push(entry);
          save(); renderAll();
          showSnackbar(`Moved to ${targetCat.name}`);
        }
        closeDialog();
      };
    });
  });
}

function openCategoryMenu(catId, x, y){
  const list = activeList();
  const cat = findCategory(list, catId);
  openPopover(x, y, [
    { label:"Rename category", onClick: () => {
      promptDialog({ title:"Rename category", label:"Category name", value:cat.name, onConfirm: v => { cat.name = v; save(); renderAll(); } });
    }},
    { sep:true },
    { label:"Delete category", danger:true, onClick: () => {
      if(list.categories.length <= 1){ showSnackbar("A list needs at least one category"); return; }
      confirmDialog({
        title:`Delete "${cat.name}"?`,
        hint: cat.entries.length ? `${cat.entries.length} title(s) in this category will also be removed.` : "This category is empty.",
        onConfirm: () => { list.categories = list.categories.filter(c=>c!==cat); save(); renderAll(); }
      });
    }}
  ]);
}

/* ================= LIST MANAGEMENT ================= */
document.getElementById("newListBtn").addEventListener("click", () => {
  promptDialog({
    title:"New list", label:"List name", placeholder:"e.g. Seasonal 2026",
    onConfirm: name => {
      const newList = { id: uid("list"), name, categories: DEFAULT_CATS.map(n => ({ id: uid("cat"), name:n, entries: [] })) };
      state.lists.push(newList);
      state.activeListId = newList.id;
      save(); renderAll();
    }
  });
});

document.getElementById("listMenuBtn").addEventListener("click", e => {
  const rect = e.currentTarget.getBoundingClientRect();
  const list = activeList();
  openPopover(rect.right - 190, rect.bottom + 4, [
    { label:"Rename list", onClick: () => {
      promptDialog({ title:"Rename list", label:"List name", value:list.name, onConfirm: v => { list.name = v; save(); renderAll(); } });
    }},
    { label:"Add category", onClick: addCategoryFlow },
    { sep:true },
    { label:"Delete list", danger:true, onClick: () => {
      if(state.lists.length <= 1){ showSnackbar("You need at least one list"); return; }
      confirmDialog({
        title:`Delete "${list.name}"?`,
        hint:`This removes the list and all ${totalEntries(list)} title(s) in it. This can't be undone.`,
        onConfirm: () => {
          state.lists = state.lists.filter(l=>l!==list);
          state.activeListId = state.lists[0].id;
          save(); renderAll();
        }
      });
    }}
  ]);
});

document.getElementById("manageCatsBtn").addEventListener("click", addCategoryFlow);
document.getElementById("fabAdd").addEventListener("click", addCategoryFlow);
function addCategoryFlow(){
  promptDialog({
    title:"Add category", label:"Category name", placeholder:"e.g. Rewatching",
    onConfirm: name => {
      activeList().categories.push({ id: uid("cat"), name, entries: [] });
      save(); renderAll();
    }
  });
}

/* ================= THEME ================= */
function applyTheme(){
  const root = document.documentElement;
  if(state.theme === "light"){ root.setAttribute("data-theme","light"); document.getElementById("themeLabel").textContent = "Theme: Light"; }
  else if(state.theme === "dark"){ root.setAttribute("data-theme","dark"); document.getElementById("themeLabel").textContent = "Theme: Dark"; }
  else { root.removeAttribute("data-theme"); document.getElementById("themeLabel").textContent = "Theme: System"; }
}
document.getElementById("themeToggle").addEventListener("click", () => {
  state.theme = state.theme === "system" ? "light" : state.theme === "light" ? "dark" : "system";
  save(); applyTheme();
});

/* ================= SETTINGS / ANILIST CONNECT / IMDB (OMDB) ================= */
function tokenValid(){
  return !!(state.settings.anilistToken && Date.now() < (state.settings.anilistTokenExpiry || 0));
}
function isAniListConnected(){
  return tokenValid() && !!state.settings.anilistUsername;
}

document.getElementById("settingsBtn").addEventListener("click", openSettingsDialog);

function openSettingsDialog(){
  const s = state.settings;
  const redirectUri = window.location.origin + window.location.pathname;
  const connected = isAniListConnected();
  openDialog(`
    <h2>Settings</h2>
    <p class="hint">Connect your AniList account and add an IMDb (via OMDb) API key for ratings.</p>

    <div class="field">
      <label>AniList account</label>
      ${connected ? `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--md-surface-container-high);padding:10px 12px;border-radius:12px;">
          <span style="font-weight:700;font-size:13.5px;">Connected as ${escapeHtml(s.anilistUsername)}</span>
          <button class="btn btn-text" id="disconnectAnilistBtn" style="padding:6px 10px;">Disconnect</button>
        </div>
        <button class="btn btn-filled" id="importAnilistBtn" style="margin-top:10px;width:100%;">Import my AniList lists</button>
      ` : `
        <input type="text" id="anilistClientIdInput" placeholder="AniList API Client ID" value="${escapeHtml(s.anilistClientId||"")}">
        <p class="hint" style="margin-top:8px;">
          Create a free API client at
          <a href="https://anilist.co/settings/developer" target="_blank" style="color:var(--md-primary);font-weight:700;">anilist.co/settings/developer</a>,
          set its Redirect URL to the address below, then paste the Client ID here:
        </p>
        <code style="display:block;background:var(--md-surface-container-high);padding:7px 9px;border-radius:8px;margin-top:2px;font-size:11px;word-break:break-all;color:var(--md-on-surface-variant);">${escapeHtml(redirectUri)}</code>
        <button class="btn btn-filled" id="connectAnilistBtn" style="margin-top:12px;width:100%;">Connect AniList</button>
      `}
    </div>

    <div class="menu-sep" style="margin:18px 0;"></div>

    <div class="field">
      <label>IMDb ratings (via OMDb)</label>
      <input type="text" id="omdbKeyInput" placeholder="OMDb API key" value="${escapeHtml(s.omdbApiKey||"")}">
      <p class="hint" style="margin-top:8px;">
        Get a free key at <a href="https://www.omdbapi.com/apikey.aspx" target="_blank" style="color:var(--md-primary);font-weight:700;">omdbapi.com/apikey.aspx</a>.
        Once saved, use "Look up IMDb rating" from any title's menu. Matching is best-effort by title — OMDb covers movies and TV broadly, but not every anime title will be found.
      </p>
    </div>

    <div class="dialog-actions">
      <button class="btn btn-text" id="settingsClose">Close</button>
      <button class="btn btn-filled" id="settingsSave">Save</button>
    </div>
  `, root => {
    root.querySelector("#settingsClose").onclick = closeDialog;
    root.querySelector("#settingsSave").onclick = () => {
      const clientIdInput = root.querySelector("#anilistClientIdInput");
      if(clientIdInput) state.settings.anilistClientId = clientIdInput.value.trim();
      state.settings.omdbApiKey = root.querySelector("#omdbKeyInput").value.trim();
      save();
      closeDialog();
      showSnackbar("Settings saved");
    };
    const connectBtn = root.querySelector("#connectAnilistBtn");
    if(connectBtn){
      connectBtn.onclick = () => {
        const clientId = root.querySelector("#anilistClientIdInput").value.trim();
        if(!clientId){ showSnackbar("Enter your AniList Client ID first"); return; }
        state.settings.anilistClientId = clientId;
        save();
        connectAniList();
      };
    }
    const disconnectBtn = root.querySelector("#disconnectAnilistBtn");
    if(disconnectBtn){
      disconnectBtn.onclick = () => { disconnectAniList(); openSettingsDialog(); };
    }
    const importBtn = root.querySelector("#importAnilistBtn");
    if(importBtn){
      importBtn.onclick = importAniListLists;
    }
  });
}

function connectAniList(){
  const clientId = state.settings.anilistClientId.trim();
  if(!clientId){ showSnackbar("Enter your AniList Client ID first"); return; }
  const url = `https://anilist.co/api/v2/oauth/authorize?client_id=${encodeURIComponent(clientId)}&response_type=token`;
  window.location.href = url;
}

function disconnectAniList(){
  state.settings.anilistToken = "";
  state.settings.anilistTokenExpiry = 0;
  state.settings.anilistUsername = "";
  state.settings.anilistUserId = null;
  save();
  showSnackbar("Disconnected from AniList");
}

function handleAniListOAuthRedirect(){
  const hash = window.location.hash;
  if(!hash || hash.indexOf("access_token") === -1) return;
  const params = new URLSearchParams(hash.slice(1));
  const token = params.get("access_token");
  const expiresIn = parseInt(params.get("expires_in") || "0", 10);
  if(!token) return;
  state.settings.anilistToken = token;
  state.settings.anilistTokenExpiry = Date.now() + (expiresIn ? expiresIn * 1000 : 365*24*60*60*1000);
  save();
  history.replaceState(null, "", window.location.pathname + window.location.search);
  fetchAniListViewer().then(() => {
    showSnackbar(state.settings.anilistUsername ? `Connected to AniList as ${state.settings.anilistUsername}` : "Connected to AniList");
  });
}

async function fetchAniListViewer(){
  if(!state.settings.anilistToken) return;
  try{
    const res = await fetch(ANILIST_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type":"application/json", "Accept":"application/json", "Authorization": "Bearer " + state.settings.anilistToken },
      body: JSON.stringify({ query: "query{ Viewer{ id name } }" })
    });
    if(res.status === 401){ disconnectAniList(); return; }
    const json = await res.json();
    if(json.data && json.data.Viewer){
      state.settings.anilistUsername = json.data.Viewer.name;
      state.settings.anilistUserId = json.data.Viewer.id;
      save();
    }
  }catch(err){ console.warn("AniList viewer lookup failed", err); }
}

async function importAniListLists(){
  if(!isAniListConnected() || !state.settings.anilistUserId){ showSnackbar("Connect AniList first"); return; }
  showSnackbar("Importing your AniList lists…");
  const query = `query($userId:Int){ MediaListCollection(userId:$userId, type:ANIME){ lists{ status entries{ progress media{ id title{romaji english} coverImage{large medium} episodes season seasonYear format description(asHtml:false) } } } } }`;
  try{
    const res = await fetch(ANILIST_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type":"application/json", "Accept":"application/json", "Authorization": "Bearer " + state.settings.anilistToken },
      body: JSON.stringify({ query, variables: { userId: state.settings.anilistUserId } })
    });
    if(res.status === 401){ disconnectAniList(); showSnackbar("Your AniList session expired — reconnect and try again"); return; }
    const json = await res.json();
    const lists = (json.data && json.data.MediaListCollection && json.data.MediaListCollection.lists) || [];
    if(!lists.length){ showSnackbar("No lists found on your AniList account"); return; }
    const statusMap = { CURRENT:"Watching", PLANNING:"Plan to Watch", COMPLETED:"Completed", PAUSED:"On Hold", DROPPED:"Dropped", REPEATING:"Rewatching" };
    const catNames = [...new Set(lists.map(l => statusMap[l.status] || l.status))];
    const newList = {
      id: uid("list"),
      name: `AniList — ${state.settings.anilistUsername}`,
      categories: catNames.map(n => ({ id: uid("cat"), name: n, entries: [] }))
    };
    let count = 0;
    lists.forEach(l => {
      const catName = statusMap[l.status] || l.status;
      const cat = findCategory(newList, newList.categories.find(c=>c.name===catName).id);
      l.entries.forEach(e => {
        const media = e.media;
        cat.entries.push({
          id: uid("entry"),
          aniListId: media.id,
          title: media.title.english || media.title.romaji || "Untitled",
          cover: media.coverImage ? (media.coverImage.large || media.coverImage.medium) : "",
          description: stripHtml(media.description),
          episodes: media.episodes || null,
          season: media.season || null,
          seasonYear: media.seasonYear || null,
          format: media.format || null,
          progress: e.progress || 0
        });
        count++;
      });
    });
    state.lists.push(newList);
    state.activeListId = newList.id;
    save(); renderAll(); closeDialog();
    showSnackbar(`Imported ${count} title${count===1?"":"s"} from AniList`);
  }catch(err){
    console.warn("AniList import failed", err);
    showSnackbar("Couldn't import from AniList right now");
  }
}

async function lookupImdb(entry){
  const key = state.settings.omdbApiKey.trim();
  if(!key){ showSnackbar("Add an OMDb / IMDb API key in Settings first"); openSettingsDialog(); return; }
  showSnackbar("Looking up IMDb…");
  try{
    const url = `https://www.omdbapi.com/?apikey=${encodeURIComponent(key)}&t=${encodeURIComponent(entry.title)}`;
    const res = await fetch(url);
    const json = await res.json();
    if(json.Response === "False"){ showSnackbar(`No IMDb match for "${entry.title}"`); return; }
    entry.imdbRating = (json.imdbRating && json.imdbRating !== "N/A") ? json.imdbRating : null;
    entry.imdbId = json.imdbID || null;
    save(); renderContent();
    showSnackbar(entry.imdbRating ? `IMDb rating for "${entry.title}": ${entry.imdbRating}/10` : `Found "${entry.title}" on IMDb, but no rating available`);
  }catch(err){
    console.warn("OMDb lookup failed", err);
    showSnackbar("Couldn't reach IMDb (OMDb) right now");
  }
}

/* ================= SEARCH (AniList) ================= */
const ANILIST_ENDPOINT = "https://graphql.anilist.co";
const SEARCH_QUERY = `
query ($search: String) {
  Page(perPage: 10) {
    media(search: $search, type: ANIME, sort: SEARCH_MATCH) {
      id
      title { romaji english }
      coverImage { large medium }
      description(asHtml: false)
      episodes
      season
      seasonYear
      format
      status
      averageScore
    }
  }
}`;

const searchInput = document.getElementById("searchInput");
const searchResultsEl = document.getElementById("searchResults");
const searchClear = document.getElementById("searchClear");

function setSearchState(html){
  searchResultsEl.innerHTML = html;
  searchResultsEl.classList.add("open");
}
function closeSearch(){
  searchResultsEl.classList.remove("open");
}

async function runSearch(term){
  if(!term || term.trim().length < 2){ closeSearch(); return; }
  setSearchState(`<div class="sr-state">Searching AniList…</div>`);
  try{
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 8000);
    const res = await fetch(ANILIST_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify({ query: SEARCH_QUERY, variables: { search: term } }),
      signal: controller.signal
    });
    clearTimeout(timeout);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    const results = (json.data && json.data.Page && json.data.Page.media) || [];
    renderSearchResults(results, term);
  }catch(err){
    console.warn("AniList search failed", err);
    setSearchState(`
      <div class="sr-state">
        Couldn't reach AniList from here right now.<br>
        <a id="manualAddLink2" style="color:var(--md-primary);font-weight:700;cursor:pointer;">Add "${escapeHtml(term)}" manually instead</a>
      </div>
    `);
    const link = document.getElementById("manualAddLink2");
    if(link) link.onclick = () => { closeSearch(); openManualAddDialog(term); };
  }
}
const debouncedSearch = debounce(e => runSearch(e.target.value), 450);
searchInput.addEventListener("input", e => {
  searchClear.style.display = e.target.value ? "flex" : "none";
  debouncedSearch(e);
});
searchClear.addEventListener("click", () => { searchInput.value=""; searchClear.style.display="none"; closeSearch(); searchInput.focus(); });
document.addEventListener("click", e => {
  if(!e.target.closest(".search-box") && !e.target.closest(".search-results")) closeSearch();
});

function listCategoryOptionsHtml(){
  let html = "";
  state.lists.forEach(list => {
    list.categories.forEach(cat => {
      const selected = (list.id === state.activeListId && cat.name === "Plan to Watch") ? "selected" : "";
      html += `<option value="${list.id}::${cat.id}" ${selected}>${escapeHtml(list.name)} → ${escapeHtml(cat.name)}</option>`;
    });
  });
  return html;
}

function renderSearchResults(results, term){
  if(!results.length){
    setSearchState(`
      <div class="sr-state">
        No matches for "${escapeHtml(term)}".<br>
        <a id="manualAddLink" style="color:var(--md-primary);font-weight:700;cursor:pointer;">Add it manually</a>
      </div>
    `);
    const link = document.getElementById("manualAddLink");
    if(link) link.onclick = () => { closeSearch(); openManualAddDialog(term); };
    return;
  }
  const rows = results.map(media => {
    const title = (media.title.english || media.title.romaji || "Untitled");
    const meta = [formatLabel(media.format), seasonLabel(media.season, media.seasonYear), media.episodes ? media.episodes+" ep" : null]
      .filter(Boolean).join(" · ");
    const cover = media.coverImage ? (media.coverImage.medium || media.coverImage.large) : "";
    return `
      <div class="sr-row" data-id="${media.id}">
        <img class="sr-cover" src="${escapeHtml(cover)}" alt="">
        <div class="sr-info">
          <div class="sr-title">${escapeHtml(title)}</div>
          <div class="sr-meta">${escapeHtml(meta)}</div>
        </div>
        <div class="sr-add">
          <select class="sr-select" data-target="${media.id}">${listCategoryOptionsHtml()}</select>
          <button class="sr-add-btn" data-add="${media.id}">Add</button>
        </div>
      </div>
    `;
  }).join("") + `<div class="sr-manual">Not what you're after? <a id="manualAddLink3">Add manually</a></div>`;

  setSearchState(rows);

  results.forEach(media => {
    const btn = searchResultsEl.querySelector(`[data-add="${media.id}"]`);
    const sel = searchResultsEl.querySelector(`[data-target="${media.id}"]`);
    btn.addEventListener("click", () => {
      const [listId, catId] = sel.value.split("::");
      addMediaToCategory(media, listId, catId);
      btn.disabled = true; btn.textContent = "Added ✓";
      setTimeout(()=>{ btn.disabled=false; btn.textContent="Add"; }, 1400);
    });
  });
  const link3 = document.getElementById("manualAddLink3");
  if(link3) link3.onclick = () => { closeSearch(); openManualAddDialog(term); };
}

function addMediaToCategory(media, listId, catId){
  const list = state.lists.find(l=>l.id===listId);
  const cat = findCategory(list, catId);
  const title = media.title.english || media.title.romaji || "Untitled";
  // avoid exact duplicates in the same category
  if(cat.entries.some(e => e.aniListId === media.id)){
    showSnackbar(`Already in ${cat.name}`);
    return;
  }
  const entry = {
    id: uid("entry"),
    aniListId: media.id,
    title,
    cover: media.coverImage ? (media.coverImage.large || media.coverImage.medium) : "",
    description: stripHtml(media.description),
    episodes: media.episodes || null,
    season: media.season || null,
    seasonYear: media.seasonYear || null,
    format: media.format || null,
    progress: 0
  };
  cat.entries.push(entry);
  save();
  if(listId === state.activeListId) renderContent();
  renderRail(); renderTopbar();
  showSnackbar(`Added "${title}" to ${list.name} → ${cat.name}`);
}

function openManualAddDialog(prefillTitle){
  const list = activeList();
  openDialog(`
    <h2>Add anime manually</h2>
    <p class="hint">For anything AniList search can't find right now.</p>
    <div class="field"><label>Title *</label><input type="text" id="maTitle" value="${escapeHtml(prefillTitle||"")}" placeholder="Show title"></div>
    <div class="field"><label>Cover image URL</label><input type="text" id="maCover" placeholder="https://…"></div>
    <div class="field"><label>Episodes</label><input type="number" id="maEpisodes" min="0" placeholder="e.g. 24"></div>
    <div class="field"><label>Season / Year</label><input type="text" id="maSeason" placeholder="e.g. Spring 2026"></div>
    <div class="field"><label>Description</label><textarea id="maDesc" placeholder="Optional"></textarea></div>
    <div class="field"><label>Add to</label>
      <select id="maTarget">${listCategoryOptionsHtml()}</select>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-text" id="maCancel">Cancel</button>
      <button class="btn btn-filled" id="maSave">Add to list</button>
    </div>
  `, root => {
    root.querySelector("#maTitle").focus();
    root.querySelector("#maCancel").onclick = closeDialog;
    root.querySelector("#maSave").onclick = () => {
      const title = root.querySelector("#maTitle").value.trim();
      if(!title) { root.querySelector("#maTitle").focus(); return; }
      const [listId, catId] = root.querySelector("#maTarget").value.split("::");
      const targetList = state.lists.find(l=>l.id===listId);
      const targetCat = findCategory(targetList, catId);
      const epRaw = root.querySelector("#maEpisodes").value;
      targetCat.entries.push({
        id: uid("entry"),
        aniListId: null,
    title,
        cover: root.querySelector("#maCover").value.trim(),
        description: root.querySelector("#maDesc").value.trim(),
        episodes: epRaw ? parseInt(epRaw,10) : null,
        season: null,
        seasonYear: root.querySelector("#maSeason").value.trim() || null,
        format: null,
        progress: 0
      });
      save(); renderAll();
      showSnackbar(`Added "${title}" to ${targetList.name} → ${targetCat.name}`);
      closeDialog();
    };
  });
}

/* ================= INIT ================= */
function renderAll(){
  renderRail();
  renderTopbar();
  renderContent();
}
applyTheme();
renderAll();
handleAniListOAuthRedirect();

})();
</script>
