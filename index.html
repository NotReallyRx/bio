<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotRx</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="viewport">
      <div class="track" id="track">
        <section class="view" id="view-bio" aria-label="Bio">
    <main class="card">
      <div class="head">
        <div class="avatar-wrap">
          <img class="avatar" id="avatar" src="" alt="avatar" />
          <span class="dot" id="status-dot"></span>
        </div>
        <div class="head-text">
          <h1 class="name" id="display-name">NotRx</h1>
          <span class="username" id="username"></span>
          <span class="status-text" id="status-text" hidden></span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="activities" id="activities"></div>

      <ul class="links" id="links"></ul>
    </main>
        </section>

        <section class="view" id="view-ports" aria-label="Web ports" aria-hidden="true" inert>
          <main class="card">
            <div class="head">
              <div class="head-text">
                <h1 class="name">web ports</h1>
              </div>
            </div>

            <div class="divider"></div>

            <section class="port-section" aria-labelledby="class09-heading">
              <h2 class="section-label" id="class09-heading">Class of '09</h2>
              <ul class="links">
                <li><a href="https://notreallyrx.github.io/C09/" data-url="https://notreallyrx.github.io/C09/"><span>class of '09</span><span class="arrow">-></span></a></li>
                <li><a href="https://notreallyrx.github.io/C09RU/" data-url="https://notreallyrx.github.io/C09RU/"><span>Class of '09: The Re-up</span><span class="arrow">-></span></a></li>
                <li><a href="https://notreallyrx.github.io/C09FS/" data-url="https://notreallyrx.github.io/C09FS/"><span>Class of '09: The Flipside</span><span class="arrow">-></span></a></li>
              </ul>
            </section>

            <section class="port-section" aria-labelledby="omori-heading">
              <h2 class="section-label" id="omori-heading">OMORI</h2>
              <ul class="links">
                <li><a href="https://notreallyrx.github.io/omori/" data-url="https://notreallyrx.github.io/omori/"><span>OMORI</span><span class="arrow">-></span></a></li>
              </ul>
            </section>

            <section class="port-section" aria-labelledby="milk-heading">
              <h2 class="section-label" id="milk-heading">Milk</h2>
              <ul class="links">
                <li><a href="https://notreallyrx.github.io/Milk-inside-a-bag-of-milk-inside-a-bag-of-milk/" data-url="https://notreallyrx.github.io/Milk-inside-a-bag-of-milk-inside-a-bag-of-milk/"><span>Milk Inside a bag of milk</span><span class="arrow">-></span></a></li>
                <li><a href="https://notreallyrx.github.io/Milk-outside-a-bag-of-milk-outside-a-bag-of-milk/" data-url="https://notreallyrx.github.io/Milk-outside-a-bag-of-milk-outside-a-bag-of-milk/"><span>milk outside a bag of milk</span><span class="arrow">-></span></a></li>
              </ul>
            </section>
          </main>
        </section>
      </div>
    </div>

    <button class="edge-tab edge-tab-right" id="tab-ports" type="button" aria-label="Open web ports">
      <span class="tab-arrow">&gt;</span><span class="tab-label">ports</span>
    </button>
    <button class="edge-tab edge-tab-left" id="tab-bio" type="button" aria-label="Back to bio" inert>
      <span class="tab-arrow">&lt;</span><span class="tab-label">bio</span>
    </button>

    <section class="viewer" id="viewer" aria-label="Embedded site viewer" aria-hidden="true">
      <div class="viewer-bar">
        <button type="button" id="back-button">Back</button>
        <span class="viewer-title" id="viewer-title">Site viewer</span>
        <button type="button" id="open-tab-button">Open in new tab</button>
        <button type="button" id="refresh-button">Refresh</button>
        <button type="button" id="fullscreen-button">Fullscreen</button>
      </div>
      <div class="frame-wrap"></div>
      <div class="viewer-note" id="viewer-note"></div>
    </section>

    <div class="player-bar" id="player-bar">
      <button class="player-toggle" id="player-toggle" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" width="14" height="14">
          <path d="M6 4l14 8-14 8V4z" fill="currentColor" />
        </svg>
        <svg
          class="icon-pause"
          viewBox="0 0 24 24"
          width="14"
          height="14"
          style="display: none"
        >
          <rect x="5" y="4" width="5" height="16" fill="currentColor" />
          <rect x="14" y="4" width="5" height="16" fill="currentColor" />
        </svg>
      </button>

      <div class="player-info">
        <span class="player-title" id="player-title">No track</span>
        <div class="player-progress-track" id="player-progress-track">
          <div class="player-progress-fill" id="player-progress-fill"></div>
        </div>
      </div>

      <span class="player-time" id="player-time">0:00</span>

      <audio id="player-audio" preload="metadata"></audio>
    </div>

    <script type="module" src="main.js"></script>
    <script src="ports.js"></script>
  </body>
</html>
